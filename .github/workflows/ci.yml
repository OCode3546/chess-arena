# Fast checks on every push and pull request: lint, types, unit tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Fetch Stockfish (for the native-engine tests)
        run: node scripts/fetch-engine.mjs linux x64
      - run: npm test
