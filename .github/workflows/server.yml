# Game server: type checks, unit + integration + 100-game soak tests, and a Docker image
# smoke test. Deploying is done by the host (see server/README.md).
name: Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/shared/protocol.ts'
      - 'src/game/rules.ts'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'src/shared/protocol.ts'
      - 'src/game/rules.ts'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f server/Dockerfile -t chess-arena-server .
      - name: Start it and check /health
        run: |
          docker run -d --name server -p 8080:8080 chess-arena-server
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1
